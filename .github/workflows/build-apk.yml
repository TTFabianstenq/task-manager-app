name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Point Gradle at preinstalled Android SDK
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> local.properties
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK for download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/task-manager.apk
          ls -lh dist/task-manager.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager-debug
          path: dist/task-manager.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK on GitHub Releases (mobile-friendly download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Task Manager APK
          body: |
            Direct APK download for Android.

            1. Tap the `task-manager.apk` file below.
            2. Allow install from this source if Android asks.
            3. Open the installed Task Manager app.
          files: dist/task-manager.apk
          make_latest: true
